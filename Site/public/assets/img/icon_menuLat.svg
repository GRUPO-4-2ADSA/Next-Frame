<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 74" width="100" height="74" fill="none" stroke="#f1f5f9">
  <!-- Secção Esquerda (reta por dentro/direita, arredondada por fora/esquerda) -->
